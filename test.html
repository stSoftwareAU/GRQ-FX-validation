<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAMstack Test</title>
</head>
<body>
  <h1>JAMstack FX Validation Dashboard Test</h1>
  
  <h2>Test Results:</h2>
  <div id="results"></div>

  <script>
    async function testJAMstack() {
      const results = document.getElementById('results');
      const tests = [];

      // Test 1: Check if index.json exists and is valid
      try {
        const response = await fetch('docs/index.json');
        if (response.ok) {
          const data = await response.json();
          tests.push('✅ index.json loaded successfully');
          tests.push(`✅ Found ${Object.keys(data.entries).length} prediction entries`);
        } else {
          tests.push('❌ Failed to load index.json');
        }
      } catch (error) {
        tests.push('❌ Error loading index.json: ' + error.message);
      }

      // Test 2: Check if main HTML files exist
      try {
        const indexResponse = await fetch('docs/index.html');
        const listResponse = await fetch('docs/list.html');
        
        if (indexResponse.ok) {
          tests.push('✅ index.html exists');
        } else {
          tests.push('❌ index.html not found');
        }
        
        if (listResponse.ok) {
          tests.push('✅ list.html exists');
        } else {
          tests.push('❌ list.html not found');
        }
      } catch (error) {
        tests.push('❌ Error checking HTML files: ' + error.message);
      }

      // Test 3: Check if prediction data exists
      try {
        const response = await fetch('docs/2025-07-27/predictions.json');
        if (response.ok) {
          const data = await response.json();
          tests.push('✅ Sample prediction data loaded');
          tests.push(`✅ Found ${data.results.length} FX pairs`);
        } else {
          tests.push('❌ Sample prediction data not found');
        }
      } catch (error) {
        tests.push('❌ Error loading sample prediction data: ' + error.message);
      }

      // Display results
      results.innerHTML = tests.map(test => `<p>${test}</p>`).join('');
    }

    // Run tests when page loads
    document.addEventListener('DOMContentLoaded', testJAMstack);
  </script>
</body>
</html>
