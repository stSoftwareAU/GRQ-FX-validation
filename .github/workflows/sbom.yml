name: SBOM

# Issue #111 (SCR-SBOM): the dashboard is a continuously-deployed PWA but
# nothing produced a Software Bill of Materials describing what is shipped
# to the live GitHub Pages instance. When a supply-chain advisory lands,
# the first incident-response question is "which version did we deploy?".
# This workflow regenerates a CycloneDX SBOM from the locked Deno tree
# (deno.lock) and the CDN libraries referenced from docs/ on every push to
# the default branch, every pull request, and a weekly schedule, then
# uploads it as a build artefact so the deployed dependency surface is
# auditable over time.
#
# Third-party actions are pinned to 40-character commit SHAs so a hijacked
# tag cannot tamper with this repository's CI (matches ci.yml /
# deno-audit.yml, Issue #14).

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]
  schedule:
    # Monday 08:00 UTC — staggered after deno-audit.yml (07:00) so the
    # weekly Deno jobs do not contend for a runner.
    - cron: "0 8 * * 1"
  workflow_dispatch:

# Issue #40: cancel superseded runs so rapid pushes do not leave an old
# SBOM job churning while a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Generating and uploading an artefact only reads the repository tree.
permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    # The generator reads deno.lock and docs/ and writes one JSON file;
    # it finishes in seconds. 10 leaves headroom for Deno's first-run
    # module fetch without billing the 360-minute GitHub default.
    timeout-minutes: 10
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # denoland/setup-deno@v2
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x

      # Derive the CycloneDX SBOM from the locked dependency tree and the
      # CDN libraries referenced from docs/.
      - name: Generate SBOM
        run: deno run --allow-read --allow-write scripts/gen-sbom.ts

      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
