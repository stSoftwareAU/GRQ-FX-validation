name: Gitleaks

# Detect secrets in pull request diffs using gitleaks-action.
#
# Mirrors the canonical NEAT-AI pattern at
# stSoftwareAU/NEAT-AI/.github/workflows/quality.yml. Third-party
# actions are pinned to 40-character commit SHAs (Issue #1756) so a
# hijacked tag cannot exfiltrate CI secrets.

on:
  pull_request:
    # Issue #144: GitHub's `*` glob stops at `/`, so ["*"] alone excludes
    # milestone/<name> branches and this gate never runs on a milestone
    # sub-issue PR.
    branches: ["*", "milestone/*"]

# Issue #40: cancel superseded PR runs so a force-push does not leave
# the previous gitleaks scan churning while the new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Issue #39: gitleaks scans a bounded commit range and completes in
    # under a minute on this repo. 10 minutes is a comfortable cap for
    # large rebases without leaving a wedged runner billing all day.
    timeout-minutes: 10
    # Issue #137: the licence is bound at job level, not on the step that
    # consumes it, because `if:` is evaluated before a step runs and the
    # `secrets` context is unavailable there. Only `env` is, so this is
    # what lets the two scanning steps below branch on the licence.
    env:
      # Org-level Gitleaks Pro licence (Issue #1636). Required for repos
      # under stSoftwareAU/*; without it gitleaks-action exits with
      # ErrLicense before scanning. Empty on Dependabot-authored PRs,
      # which receive no Actions secrets at all. Configure in repo or org
      # secrets.
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      # Fetch the PR base branch so gitleaks-action's computed commit
      # range (`<base_sha>^..<head_sha>`) resolves on the runner.
      # Without this step the action fails with
      # "fatal: Invalid revision range" because the base ref's parent
      # is not in the shallow checkout (Issue #1756). Mirrors the
      # NEAT-AI quality.yml pattern.
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        # Issue #159: the base ref reaches the shell through `env:`, not a
        # `${{ }}` splice inside `run:`, so a crafted branch name can never
        # be interpreted as shell (semgrep run-shell-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch origin "${BASE_REF}:${BASE_REF}" || true
      # Issue #136: v2.3.9 was immutable but frozen — it runs on the Node 20
      # runtime GitHub removed from hosted runners on 16 September 2026, so
      # this gate would pass its presence check while never scanning. v3.0.0
      # moves the runtime to Node 24 and changes no input, output or
      # behaviour, so the env wiring below carries over unchanged.
      # gitleaks/gitleaks-action@v3.0.0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        # Issue #137: run the licensed action only when a licence is
        # actually present. Unguarded it also runs on a Dependabot PR —
        # which receives no Actions secrets — exits with ErrLicense
        # before scanning a single commit, and leaves the job green over
        # an unscanned diff (gitleaks-action issue 2981).
        if: env.GITLEAKS_LICENSE != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Issue #137: the open-source CLI needs no licence, so it covers
      # exactly the runs the action cannot — Dependabot PRs and forks. The
      # two conditions are complementary, so one scanner always runs and
      # a green job always means a scanned diff.
      - name: Gitleaks (open-source CLI fallback)
        if: env.GITLEAKS_LICENSE == ''
        # Issue #159: the commit range reaches the shell through env: and
        # is quoted there, never spliced in as a ${{ }} expression
        # (semgrep run-shell-injection).
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Pinned release and the SHA-256 published in that release's own
          # gitleaks_<version>_checksums.txt. An unpinned or unverified
          # download is an unreviewed binary handed the whole diff.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          archive="${tmp}/gitleaks.tar.gz"
          curl --silent --show-error --fail --location --retry 3 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar --extract --gzip --file "${archive}" --directory "${tmp}" gitleaks
          "${tmp}/gitleaks" git --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" .
