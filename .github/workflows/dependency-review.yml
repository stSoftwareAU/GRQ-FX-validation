name: Dependency Review

# Third-party actions are pinned to 40-character commit SHAs (Issue #14)
# so a hijacked tag cannot bypass the dependency-review gate that runs
# on every PR.

on:
  pull_request:
    # Issue #144: GitHub's `*` glob stops at `/`, so ["*"] alone excludes
    # milestone/<name> branches and every milestone sub-issue PR merged
    # without this dependency-vulnerability scan ever running.
    branches: ["*", "milestone/*"]

# Issue #40: cancel superseded PR runs so a force-push does not leave
# the previous dependency-review run churning while the new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Issue #39: dependency-review-action is a single API-driven scan
    # that normally finishes in under a minute. 5 minutes caps a stuck
    # runner without truncating a slow but legitimate scan.
    timeout-minutes: 5
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Issue #127: the dependency-review job only checks out the tree
          # for actions/dependency-review-action to scan; it never pushes
          # back to the repository and fetches no private submodules, so
          # GITHUB_TOKEN must not be written to .git/config where a later
          # step could read it.
          persist-credentials: false
      # actions/dependency-review-action@v4.9.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
