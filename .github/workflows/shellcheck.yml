name: ShellCheck

on:
  pull_request:
    # Issue #144: GitHub's `*` glob stops at `/`, so ["*"] alone excludes
    # milestone/<name> branches and this gate never runs on a milestone
    # sub-issue PR.
    branches: ["*", "milestone/*"]
  push:
    branches: [main, master]

# Issue #40: cancel superseded runs so a force-push or rapid pushes do
# not leave the previous ShellCheck job churning while the new one
# starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # Issue #39: ShellCheck over the repo's handful of bash scripts
    # finishes in seconds. 5 minutes is a generous cap for a tool that
    # never should approach the 360-minute GitHub default.
    timeout-minutes: 5
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Issue #131: the shellcheck job only reads the tree so the
          # linter can scan it. It never pushes back to the repository and
          # fetches no private submodules, while the third-party
          # ludeeus/action-shellcheck runs over that tree afterwards, so
          # GITHUB_TOKEN must not be written to .git/config where a later
          # step could read it.
          persist-credentials: false
      # ludeeus/action-shellcheck@2.0.0
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: .
          severity: warning
