name: Semgrep

on:
  pull_request:
    # Issue #144: GitHub's `*` glob stops at `/`, so ["*"] alone excludes
    # milestone/<name> branches and this gate never runs on a milestone
    # sub-issue PR.
    branches: ["*", "milestone/*"]

# Issue #40: cancel superseded PR runs so a force-push does not leave
# the previous Semgrep SAST scan churning while the new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    # Issue #39: `semgrep ci --config p/default` over this repo
    # completes in a couple of minutes. 15 minutes leaves headroom for
    # rule-pack growth without leaving a wedged scan churning all day.
    timeout-minutes: 15
    container:
      # semgrep/semgrep:1.163.0 — pinned to an immutable sha256 digest
      # so a hijacked :latest tag cannot exfiltrate SEMGREP_APP_TOKEN or
      # tamper with SAST results (Issue #16). When bumping, update both
      # the tag (for human readability) and the digest from Docker Hub.
      image: semgrep/semgrep:1.163.0@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # Issue #130: the semgrep job only reads the tree so `semgrep ci`
          # can scan it. It never pushes back to the repository and fetches
          # no private submodules, while `semgrep ci` downloads and runs
          # third-party rule packs alongside SEMGREP_APP_TOKEN in the same
          # job, so GITHUB_TOKEN must not be written to .git/config where a
          # later step could read it.
          persist-credentials: false
      - name: Run Semgrep CI
        run: semgrep ci --config p/default
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
