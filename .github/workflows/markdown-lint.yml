name: Markdown Lint

on:
  pull_request:
    # Issue #144: GitHub's `*` glob stops at `/`, so ["*"] alone excludes
    # milestone/<name> branches and this gate never runs on a milestone
    # sub-issue PR.
    branches: ["*", "milestone/*"]
  push:
    branches: [main, master]

# Issue #40: cancel superseded runs so a force-push or rapid pushes do
# not leave the previous markdownlint job churning while the new one
# starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    # Issue #39: markdownlint-cli2 plus the optional Mermaid validator
    # are bounded file scans that finish well under 5 minutes. 10
    # minutes covers a slow `npm install -g markdownlint-cli2` without
    # leaving a wedged runner billing for the 360-minute default.
    timeout-minutes: 10
    steps:
      # actions/checkout@v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Issue #128: the markdownlint job only reads the tree so
          # markdownlint-cli2 and the Mermaid validator can scan it. It
          # never pushes back to the repository and fetches no private
          # submodules, while `npm install -g markdownlint-cli2` runs
          # third-party code in the same job, so GITHUB_TOKEN must not be
          # written to .git/config where a later step could read it.
          persist-credentials: false
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "lts/*"
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      - name: Run markdownlint-cli2
        run: markdownlint-cli2
      # Optional: mirror the local check-mermaid quality gate when Deno
      # and the worker module are available in the repo (Issue #1683).
      - name: Detect Deno worker module
        id: detect-deno
        run: |
          set -euo pipefail
          if [ -f worker/deno/mod.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # denoland/setup-deno@v2
      - if: steps.detect-deno.outputs.present == 'true'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - if: steps.detect-deno.outputs.present == 'true'
        name: Validate Mermaid blocks
        run: deno run --allow-read --allow-env=DEBUG,LOG_LEVEL,CONFIG_PATH,OUTPUT_JSON worker/deno/mod.ts check-mermaid
