name: CI/CD Pipeline

# Third-party actions are pinned to 40-character commit SHAs (Issue #14)
# so a hijacked tag cannot exfiltrate CI secrets or publish arbitrary
# content to the production GitHub Pages site through deploy-pages.

on:
  pull_request:
    branches: ["Develop"]
  push:
    branches: ["Develop"]

# Issue #40: cancel superseded runs on the same ref so a force-push or
# rapid back-to-back commits on Develop do not leave stale CI/CD runs
# churning. The deploy-pages job overrides this with a separate
# `pages` group (cancel-in-progress: false) so an in-flight Pages
# deploy is allowed to finish, per GitHub's Pages guidance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Issue #37: declare a minimal top-level GITHUB_TOKEN scope so the
# check-changes and quality jobs cannot inherit GitHub's broad default
# permissions. The deploy-pages job overrides this with the narrower
# pages: write + id-token: write it actually needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    # Issue #39: cap runner exposure. The change-detection step is
    # entirely local git work — it never needs more than a minute or
    # two, so 5 surfaces any hang well within free-tier budgets.
    timeout-minutes: 5
    outputs:
      docs-changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0 # Fetch full history for proper diffs

      - name: Check for changes
        id: filter
        # Issue #41: harden the multi-line bash with `set -euo pipefail`
        # so an interim `git diff` failure (e.g. against a missing
        # parent commit after a force-push) cannot silently produce an
        # empty changed_files.txt and trick the Pages deploy gate into
        # reporting docs-changed=false. `shell: bash` is implicit on
        # ubuntu-latest but stating it explicitly is the documented
        # hardening pattern.
        shell: bash
        run: |
          set -euo pipefail
          # Get list of changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # For PRs, compare with base branch using GitHub's merge-base
            git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} > changed_files.txt
          else
            # For pushes, compare with previous commit
            # Handle case where before SHA might be null (first commit)
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
              git diff --name-only ${{ github.event.before }}...${{ github.sha }} > changed_files.txt
            else
              # For first commit, show all files
              git ls-tree -r --name-only ${{ github.sha }} > changed_files.txt
            fi
          fi

          # Check if docs changed
          if grep -E "^(docs/)" changed_files.txt > /dev/null; then
            echo "docs=true" >> $GITHUB_OUTPUT
          else
            echo "docs=false" >> $GITHUB_OUTPUT
          fi

          echo "Changed files:"
          cat changed_files.txt

  quality:
    # Issue #30: prior to this gate the repository's tests were never
    # exercised in CI, so regressions like the "Failed to load prediction
    # data" screen could ship to production. quality.sh is the single
    # entry point that runs every required check.
    name: Quality Gate
    runs-on: ubuntu-latest
    # Issue #39: the Node + Deno test suites finish in well under five
    # minutes today. 20 leaves headroom for additional test files
    # without leaving a wedged runner billing for the 360-minute
    # GitHub default.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        # actions/setup-node@v4
        # Issue #38: Node.js 20 is flagged "EOL soon"; the GitHub-hosted
        # runner force-upgrade to Node 24 lands 2026-06-02 and the
        # node20 runtime is removed 2026-09-16. Pin to Node 22 LTS so
        # we migrate on our own schedule.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Setup Deno
        # denoland/setup-deno@v2
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v1.x

      - name: Run quality.sh
        run: ./quality.sh < /dev/null

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    # Issue #39: the Pages deploy is upload + activation; in practice
    # it completes in 1–3 minutes. 10 caps a stalled deploy without
    # truncating a slow but legitimate upload.
    timeout-minutes: 10
    needs: [check-changes, quality]
    if: |
      github.ref == 'refs/heads/Develop' &&
      needs.check-changes.outputs.docs-changed == 'true'
    # Issue #40: per GitHub's Pages-deployment guidance, an in-flight
    # Pages deploy must be allowed to finish even when a newer Develop
    # commit lands, so this job opts out of the workflow-level
    # cancel-in-progress and uses a dedicated `pages` group instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Pages
        # actions/configure-pages@v4
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d

      - name: Upload artifact
        # actions/upload-pages-artifact@v3
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
